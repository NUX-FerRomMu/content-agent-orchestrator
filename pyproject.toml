[project]
name = "content-agent-orchestrator"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "opencv-python-headless>=4.10,<5",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
generation = [
    "torch>=2.6,<3",
    "diffusers>=0.35,<0.38",
    "transformers>=4.49,<5",
    "accelerate>=1.2,<2",
    "safetensors>=0.5,<1",
]
swap = [
    "av>=14,<19",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]
swap-cuda = [
    "av>=14,<19",
    "onnx>=1.17,<2",
    "onnxruntime-gpu>=1.20,<2",
]

[tool.uv]
conflicts = [[{ group = "swap" }, { group = "swap-cuda" }]]
